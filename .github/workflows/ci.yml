name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compile shared trước (server/client phụ thuộc shared)
      - name: Build all modules
        run: mvn -B -ntp clean install -DskipTests

      # Chạy unit test (chỉ shared có test, server/client cần DB nên skip)
      - name: Run unit tests (shared)
        run: mvn -B -ntp -pl shared test

      # Upload report kể cả khi test fail để debug
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 14

      # Verify code compile end-to-end (cả server với DAO + client với JavaFX)
      - name: Verify full compile
        run: mvn -B -ntp compile
